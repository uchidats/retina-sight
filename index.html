<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retina Sight | 網膜・黄斑疾患と治療の情報サイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", "Yu Gothic", "YuGothic",
        "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      color: #24323d;
      background: #ffffff;
      line-height: 1.8;
    }

    header {
      border-bottom: 1px solid #e5eaed;
      background: #ffffff;
    }

    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px 24px;
    }

    .logo {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #123d52;
    }

    .hero {
      background: #f4f8f9;
    }

    .hero-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 72px 24px 64px;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.35;
      color: #123d52;
    }

    .hero-subtitle {
      margin: 0;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 500;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    .intro {
      max-width: 720px;
      margin-bottom: 52px;
      font-size: 17px;
    }

    h2 {
      margin: 0 0 24px;
      font-size: 26px;
      color: #123d52;
    }

    .disease-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .disease-card {
      display: block;
      padding: 24px 20px;
      border: 1px solid #dce4e7;
      border-radius: 10px;
      background: #ffffff;
      color: #24323d;
      text-decoration: none;
      transition: 0.2s;
    }

    .disease-card:hover {
      border-color: #6c98a8;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transform: translateY(-2px);
    }

    .disease-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 18px;
      color: #123d52;
    }

    .disease-card span {
      font-size: 14px;
      color: #687780;
    }

    footer {
      border-top: 1px solid #e5eaed;
      padding: 32px 24px;
      text-align: center;
      font-size: 13px;
      color: #718089;
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 14px 20px;
      }

      .logo {
        font-size: 23px;
      }

      .hero-inner {
        padding: 52px 20px 48px;
      }

      main {
        padding: 40px 20px 64px;
      }

      .disease-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <div class="logo">Retina Sight</div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>Retina Sight</h1>
      <p class="hero-subtitle">
        網膜・黄斑疾患と治療の情報サイト
      </p>
    </div>
  </section>

  <main>

    <div class="intro">
      <p>
        網膜や黄斑の病気、検査、治療について、
        必要な情報をわかりやすく整理して紹介します。
      </p>
    </div>

    <section>
      <h2>疾患から探す</h2>

      <div class="disease-grid">

        <a class="disease-card" href="#">
          <strong>加齢黄斑変性</strong>
          <span>Age-related macular degeneration</span>
        </a>

        <a class="disease-card" href="#">
          <strong>糖尿病黄斑浮腫</strong>
          <span>Diabetic macular edema</span>
        </a>

        <a class="disease-card" href="#">
          <strong>網膜静脈閉塞症</strong>
          <span>Retinal vein occlusion</span>
        </a>

        <a class="disease-card" href="diseases/erm.html">
          <strong>黄斑上膜</strong>
          <span>Epiretinal membrane</span>
        </a>

        <a class="disease-card" href="#">
          <strong>黄斑円孔</strong>
          <span>Macular hole</span>
        </a>

        <a class="disease-card" href="#">
          <strong>網膜剥離</strong>
          <span>Retinal detachment</span>
        </a>

      </div>
    </section>

  </main>

  <footer>
    © Retina Sight
  </footer>

</body>
</html>
